{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Controle de Estoque{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'estoque/style.css' %}">
</head>
<body>
    <header>
        <h2>Controle de Estoque</h2>
        <nav>
            <a href="{% url 'estoque:produto_lista' %}">Produtos</a>
            <a href="{% url 'estoque:movimentacao_lista' %}">Movimentações</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>

    <main>
        {# mensagens enviadas pelas views #}
        {% for mensagem in messages %}
            <p class="mensagem {{ mensagem.tags }}">{{ mensagem }}</p>
        {% endfor %}

        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
